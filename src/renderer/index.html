<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://renderoyuncu.net https://minotar.net; font-src 'self'; connect-src 'none'">
  <title>RenderOyuncu AFK Client</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img src="assets/logo.png" alt="">
      <span>Render<b>Oyuncu</b></span>
      <em>AFK Client</em>
    </div>
    <div class="window-buttons">
      <button id="btn-min" aria-label="Küçült">
        <svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg>
      </button>
      <button id="btn-close" aria-label="Kapat">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" /></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar">
      <div class="nav-items" id="nav"></div>
      <button class="profile" id="profile"></button>
    </nav>
    <div class="content">
      <div class="update-banner" id="update-banner" role="status" hidden></div>
      <main class="page" id="page"></main>
      <footer class="launchbar">
        <div class="launch-status">
          <span id="launch-text">Hazır</span>
          <div class="progress"><div class="progress-fill" id="launch-fill"></div></div>
        </div>
        <button class="play" id="launch-btn">BAŞLAT</button>
      </footer>
    </div>
    <aside class="rightbar">
      <button class="nav-item" id="chat-toggle" aria-expanded="false"></button>
    </aside>
    <section class="chat-panel" id="chat-panel" hidden></section>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
